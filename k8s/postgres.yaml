# PostgreSQL 18 + pgvector as a single-replica StatefulSet with its own persistent volume.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: documind
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: documind }
spec:
  clusterIP: None # headless: stable DNS name postgres.documind.svc.cluster.local
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: documind
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: documind }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: documind }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: documind-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: documind-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: documind-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            # PostgreSQL 18 images store data under /var/lib/postgresql/18/... : mount the parent.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # kubeadm has no default StorageClass: install one (e.g. local-path-provisioner) first.
        resources:
          requests:
            storage: 10Gi
