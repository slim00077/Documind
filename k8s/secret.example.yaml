# TEMPLATE ONLY - not part of kustomization.yaml and must never contain real values in Git.
# Create the real secret imperatively instead:
#
#   kubectl -n documind create secret generic documind-secrets \
#     --from-literal=POSTGRES_USER=documind \
#     --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#     --from-literal=DATABASE_URL='postgresql://documind:<strong-password>@postgres:5432/documind?schema=public' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GEMINI_API_KEY='<key>' \
#     --from-literal=OPENROUTER_API_KEY='<key>' \
#     --from-literal=GROQ_API_KEY='<key>' \
#     --from-literal=OPENAI_API_KEY=''
#
# Private GHCR images also need a pull secret:
#   kubectl -n documind create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> --docker-password=<PAT with read:packages>
apiVersion: v1
kind: Secret
metadata:
  name: documind-secrets
  namespace: documind
type: Opaque
stringData:
  POSTGRES_USER: documind
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://documind:CHANGE_ME@postgres:5432/documind?schema=public
  JWT_SECRET: CHANGE_ME
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
