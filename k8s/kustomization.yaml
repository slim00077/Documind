# kubectl apply -k k8s/      (create the `documind-secrets` secret first - see secret.example.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: documind
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
# Deploy a specific CI build instead of :latest:
#   cd k8s && kustomize edit set image ghcr.io/slim00077/documind-backend:<git-sha>
images:
  - name: ghcr.io/slim00077/documind-backend
    newTag: latest
  - name: ghcr.io/slim00077/documind-frontend
    newTag: latest
