# SonarQube (Server or Cloud) - DocuMind web client. Analysed by the `sonarqube` job of CI - Frontend.
# The project key must exist on the SonarQube instance (create it manually with this key).
sonar.projectKey=slim00077_documind-frontend
sonar.projectName=DocuMind - Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/node_modules/**,dist/**,public/**

# ESLint findings imported as external issues (written by `npm run lint:ci`).
sonar.eslint.reportPaths=eslint-report.json

# Make the scanner wait for the quality gate and fail the CI job when it is red.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
