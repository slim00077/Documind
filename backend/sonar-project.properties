# SonarQube (Server or Cloud) - DocuMind API. Analysed by the `sonarqube` job of CI - Backend.
# The project key must exist on the SonarQube instance (create it manually with this key).
sonar.projectKey=slim00077_documind-backend
sonar.projectName=DocuMind - Backend API
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**,dist/**,generated/**,coverage/**,uploads/**

# LCOV produced by `npm run test:coverage` (node:test + V8 coverage, 47 integration tests).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Make the scanner wait for the quality gate and fail the CI job when it is red.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
